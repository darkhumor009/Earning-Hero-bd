<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earning Hero BD - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.login-box{
  max-width:400px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 14px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn{
  width:100%;
  background:#2563eb;
  color:white;
  padding:14px;
}

.header{
  background:white;
  border-radius:18px;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.header h1{
  font-size:22px;
}

.admin-badge{
  background:#fee2e2;
  color:#dc2626;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.logout{
  background:#ef4444;
  color:white;
  margin-left:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat-title{
  color:#777;
  font-size:13px;
}

.stat-value{
  font-size:27px;
  font-weight:bold;
  margin-top:8px;
}

.section{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.section h2{
  font-size:18px;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.save-btn{
  background:#16a34a;
  color:white;
}

.task{
  border:1px solid #eee;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.task-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.task-title{
  font-weight:bold;
}

.task-info{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

.delete-btn{
  background:#fee2e2;
  color:#dc2626;
}

.edit-btn{
  background:#dbeafe;
  color:#2563eb;
  margin-right:5px;
}

.withdraw{
  border:1px solid #eee;
  border-radius:12px;
  padding:15px;
  margin-bottom:10px;
}

.withdraw-info{
  line-height:1.7;
  font-size:14px;
}

.approve{
  background:#dcfce7;
  color:#15803d;
  margin-right:5px;
}

.reject{
  background:#fee2e2;
  color:#dc2626;
}

.user{
  border-bottom:1px solid #eee;
  padding:12px 0;
  font-size:14px;
}

.hidden{
  display:none;
}

.message{
  margin-top:12px;
  text-align:center;
  font-size:14px;
}

.success{
  color:#16a34a;
}

.error{
  color:#dc2626;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .header{
    flex-direction:column;
    gap:12px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">

  <div class="logo">💰 Earning Hero BD</div>
  <div class="subtitle">Admin Panel Login</div>

  <input id="email" type="email" placeholder="Admin Email">

  <input id="password" type="password" placeholder="Password">

  <button class="login-btn" onclick="login()">
    Login to Admin Panel
  </button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPage" class="container hidden">

  <div class="header">
    <div>
      <h1>💰 Earning Hero BD</h1>
      <span class="admin-badge">ADMIN PANEL</span>
    </div>

    <div>
      <span id="adminEmail"></span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>


  <!-- STATS -->
  <div class="stats">

    <div class="card">
      <div class="stat-title">Total Users</div>
      <div class="stat-value" id="totalUsers">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Active Users</div>
      <div class="stat-value" id="activeUsers">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Total Points</div>
      <div class="stat-value" id="totalPoints">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Pending Withdrawals</div>
      <div class="stat-value" id="pendingWithdrawals">0</div>
    </div>

  </div>


  <!-- SETTINGS -->
  <div class="section">

    <h2>⚙️ System Settings</h2>

    <div class="form-grid">

      <div>
        <label>Ad Reward</label>
        <input id="adReward" type="number">
      </div>

      <div>
        <label>Daily Ad Limit</label>
        <input id="dailyAdLimit" type="number">
      </div>

      <div>
        <label>Minimum Withdrawal</label>
        <input id="minimumWithdraw" type="number">
      </div>

      <div>
        <label>Default Task Reward</label>
        <input id="defaultTaskReward" type="number">
      </div>

    </div>

    <button class="save-btn" onclick="saveSettings()">
      💾 Save Settings
    </button>

    <div id="settingsMessage" class="message"></div>

  </div>


  <!-- TASKS -->
  <div class="section">

    <h2>📋 Task Management</h2>

    <div id="taskList">
      Loading...
    </div>

    <hr style="margin:20px 0;border:0;border-top:1px solid #eee">

    <h3 style="margin-bottom:15px">➕ Add New Task</h3>

    <input id="newTaskTitle" placeholder="Task title">

    <input id="newTaskDescription" placeholder="Task description">

    <div class="form-grid">

      <input id="newTaskReward" type="number" placeholder="Reward">

      <input id="newTaskLimit" type="number" placeholder="Daily limit">

    </div>

    <button class="save-btn" onclick="addTask()">
      Add Task
    </button>

    <div id="taskMessage" class="message"></div>

  </div>


  <!-- WITHDRAWALS -->
  <div class="section">

    <h2>💸 Pending Withdrawals</h2>

    <div id="withdrawalList">
      Loading...
    </div>

  </div>


  <!-- USERS -->
  <div class="section">

    <h2>👥 Users</h2>

    <div id="userList">
      Loading...
    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://mzhkklykcusmnbglgxop.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OwCn0Wxtbgkrbs44pzmezg__EAOPJM0";

const { createClient } =
supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Logging in...";
  message.className = "message";

  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    message.textContent =
      "Login failed: " + error.message;

    message.className =
      "message error";

    return;
  }

  /* Check admin access */
  const { data: settings, error: adminError } =
    await db
      .from("settings")
      .select("*")
      .limit(1);

  if(adminError || !settings || settings.length === 0){

    await db.auth.signOut();

    message.textContent =
      "You are not authorized as admin.";

    message.className =
      "message error";

    return;
  }

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("adminPage")
    .classList.remove("hidden");

  document.getElementById("adminEmail")
    .textContent = email;

  loadDashboard();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  location.reload();

}


/* =========================
   DASHBOARD
========================= */

async function loadDashboard(){

  await loadStats();
  await loadSettings();
  await loadTasks();
  await loadWithdrawals();
  await loadUsers();

}


/* =========================
   STATS
========================= */

async function loadStats(){

  const { data: users } =
    await db
      .from("users")
      .select("balance,status");

  if(users){

    document.getElementById("totalUsers")
      .textContent = users.length;

    document.getElementById("activeUsers")
      .textContent =
      users.filter(u => u.status === "active").length;

    const total =
      users.reduce(
        (sum,u) => sum + Number(u.balance || 0),
        0
      );

    document.getElementById("totalPoints")
      .textContent = total.toLocaleString();
  }


  const { data: withdrawals } =
    await db
      .from("withdrawals")
      .select("id")
      .eq("status","pending");

  document.getElementById("pendingWithdrawals")
    .textContent =
    withdrawals ? withdrawals.length : 0;

}


/* =========================
   SETTINGS
========================= */

async function loadSettings(){

  const { data, error } =
    await db
      .from("settings")
      .select("*")
      .limit(1);

  if(error){

    console.error(error);
    return;
  }

  if(!data || !data.length) return;

  const s = data[0];

  document.getElementById("adReward")
    .value = s.ad_reward;

  document.getElementById("dailyAdLimit")
    .value = s.daily_ad_limit;

  document.getElementById("minimumWithdraw")
    .value = s.minimum_withdraw;

  document.getElementById("defaultTaskReward")
    .value = s.default_task_reward;

}


/* =========================
   SAVE SETTINGS
========================= */

async function saveSettings(){

  const message =
    document.getElementById("settingsMessage");

  const { data } =
    await db
      .from("settings")
      .select("id")
      .limit(1);

  if(!data || !data.length){

    message.textContent =
      "Settings row not found.";

    message.className =
      "message error";

    return;
  }

  const id = data[0].id;

  const { error } =
    await db
      .from("settings")
      .update({

        ad_reward:
          Number(document.getElementById("adReward").value),

        daily_ad_limit:
          Number(document.getElementById("dailyAdLimit").value),

        minimum_withdraw:
          Number(document.getElementById("minimumWithdraw").value),

        default_task_reward:
          Number(document.getElementById("defaultTaskReward").value),

        updated_at:
          new Date().toISOString()

      })
      .eq("id",id);

  if(error){

    message.textContent =
      "Error: " + error.message;

    message.className =
      "message error";

    return;
  }

  message.textContent =
    "Settings saved successfully!";

  message.className =
    "message success";

}


/* =========================
   TASKS
========================= */

async function loadTasks(){

  const list =
    document.getElementById("taskList");

  const { data, error } =
    await db
      .from("tasks")
      .select("*")
      .order("id",{ascending:true});

  if(error){

    list.innerHTML =
      `<div class="error">${error.message}</div>`;

    return;
  }

  if(!data.length){

    list.innerHTML =
      "No tasks found.";

    return;
  }

  list.innerHTML = "";

  data.forEach(task => {

    const div =
      document.createElement("div");

    div.className = "task";

    div.innerHTML = `

      <div class="task-top">

        <div>
          <div class="task-title">
            ${escapeHtml(task.title)}
          </div>

          <div class="task-info">
            Reward: ${task.reward} points |
            Daily Limit: ${task.daily_limit} |
            Status: ${task.active ? "Active" : "Inactive"}
          </div>
        </div>

        <div>

          <button
            class="edit-btn"
            onclick="toggleTask(${task.id},${task.active})">
            ${task.active ? "Disable" : "Enable"}
          </button>

          <button
            class="delete-btn"
            onclick="deleteTask(${task.id})">
            Delete
          </button>

        </div>

      </div>
    `;

    list.appendChild(div);

  });

}


/* =========================
   ADD TASK
========================= */

async function addTask(){

  const title =
    document.getElementById("newTaskTitle")
      .value.trim();

  const description =
    document.getElementById("newTaskDescription")
      .value.trim();

  const reward =
    Number(document.getElementById("newTaskReward").value);

  const limit =
    Number(document.getElementById("newTaskLimit").value);

  const message =
    document.getElementById("taskMessage");

  if(!title || !reward || !limit){

    message.textContent =
      "Please fill all required fields.";

    message.className =
      "message error";

    return;
  }

  const { error } =
    await db
      .from("tasks")
      .insert({

        title:title,
        description:description,
        reward:reward,
        daily_limit:limit,
        active:true

      });

  if(error){

    message.textContent =
      "Error: " + error.message;

    message.className =
      "message error";

    return;
  }

  message.textContent =
    "Task added successfully!";

  message.className =
    "message success";

  document.getElementById("newTaskTitle").value="";
  document.getElementById("newTaskDescription").value="";
  document.getElementById("newTaskReward").value="";
  document.getElementById("newTaskLimit").value="";

  loadTasks();

}


/* =========================
   ENABLE / DISABLE TASK
========================= */

async function toggleTask(id,current){

  const { error } =
    await db
      .from("tasks")
      .update({
        active:!current
      })
      .eq("id",id);

  if(error){

    alert(error.message);
    return;

  }

  loadTasks();

}


/* =========================
   DELETE TASK
========================= */

async function deleteTask(id){

  if(!confirm("Delete this task?")) return;

  const { error } =
    await db
      .from("tasks")
      .delete()
      .eq("id",id);

  if(error){

    alert(error.message);
    return;

  }

  loadTasks();

}


/* =========================
   WITHDRAWALS
========================= */

async function loadWithdrawals(){

  const list =
    document.getElementById("withdrawalList");

  const { data,error } =
    await db
      .from("withdrawals")
      .select("*")
      .eq("status","pending")
      .order("created_at",{ascending:false});

  if(error){

    list.innerHTML =
      `<div class="error">${error.message}</div>`;

    return;
  }

  if(!data.length){

    list.innerHTML =
      "No pending withdrawals.";

    return;
  }

  list.innerHTML = "";

  data.forEach(w => {

    const div =
      document.createElement("div");

    div.className="withdraw";

    div.innerHTML = `

      <div class="withdraw-info">

        <b>Telegram ID:</b>
        ${w.telegram_id}<br>

        <b>Amount:</b>
        ${w.amount} points<br>

        <b>Method:</b>
        ${escapeHtml(w.payment_method)}<br>

        <b>Number:</b>
        ${escapeHtml(w.payment_number)}<br>

        <b>Date:</b>
        ${new Date(w.created_at).toLocaleString()}

      </div>

      <br>

      <button
        class="approve"
        onclick="processWithdrawal(${w.id},'approved')">
        Approve
      </button>

      <button
        class="reject"
        onclick="processWithdrawal(${w.id},'rejected')">
        Reject
      </button>

    `;

    list.appendChild(div);

  });

}


/* =========================
   PROCESS WITHDRAWAL
========================= */

async function processWithdrawal(id,status){

  const text =
    status === "approved"
      ? "Approve this withdrawal?"
      : "Reject this withdrawal?";

  if(!confirm(text)) return;

  const { error } =
    await db
      .from("withdrawals")
      .update({

        status:status,

        processed_at:
          new Date().toISOString()

      })
      .eq("id",id);

  if(error){

    alert(error.message);
    return;

  }

  loadStats();
  loadWithdrawals();

}


/* =========================
   USERS
========================= */

async function loadUsers(){

  const list =
    document.getElementById("userList");

  const { data,error } =
    await db
      .from("users")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(100);

  if(error){

    list.innerHTML =
      `<div class="error">${error.message}</div>`;

    return;
  }

  if(!data.length){

    list.innerHTML =
      "No users yet.";

    return;
  }

  list.innerHTML="";

  data.forEach(user => {

    const div =
      document.createElement("div");

    div.className="user";

    div.innerHTML = `

      <b>${escapeHtml(user.first_name || "User")}</b>

      ${user.username
        ? " @" + escapeHtml(user.username)
        : ""}

      <br>

      Telegram ID:
      ${user.telegram_id}

      <br>

      Balance:
      <b>${user.balance}</b> points

      <br>

      Status:
      ${escapeHtml(user.status)}

    `;

    list.appendChild(div);

  });

}


/* =========================
   HTML SECURITY
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   AUTO LOGIN CHECK
========================= */

async function checkSession(){

  const { data } =
    await db.auth.getSession();

  if(data.session){

    const email =
      data.session.user.email;

    const { data:settings,error } =
      await db
        .from("settings")
        .select("*")
        .limit(1);

    if(!error && settings && settings.length){

      document.getElementById("loginPage")
        .classList.add("hidden");

      document.getElementById("adminPage")
        .classList.remove("hidden");

      document.getElementById("adminEmail")
        .textContent=email;

      loadDashboard();

    }

  }

}

checkSession();

</script>

</body>
</html>
